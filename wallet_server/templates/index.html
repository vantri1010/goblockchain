<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Wallet</title>
    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for additional refinements */
        body {
            font-family: 'Inter', sans-serif;
        }

        .textarea-resize-none {
            resize: none;
        }

        .input-focus {
            transition: all 0.2s ease;
        }

        .input-focus:focus {
            ring: 2px;
            ring-offset-2;
            ring-blue-500;
        }
    </style>
    <script>
        $(function () {
            $.ajax({
                url: '/wallet',
                type: 'GET',
                success: function (response) {
                    $('#public_key').val(response['public_key']);
                    $('#private_key').val(response['private_key']);
                    $('#blockchain_address').val(response['blockchain_address']);
                    console.info(response);
                },
                error: function (error) {
                    console.error(error);
                }
            });

            $('#send_money_button').click(function () {
                let sendAmount = $('#send_amount').val();
                let walletAmount = $('#wallet_amount').text();
                sendAmount = parseFloat(sendAmount);
                walletAmount = parseFloat(walletAmount);

                if (isNaN(sendAmount) || sendAmount <= 0) {
                    alert('Please enter a valid positive amount.');
                    return;
                }

                if (sendAmount > walletAmount) {
                    alert('Insufficient funds! You cannot send more than your wallet balance.');
                    return;
                }

                let confirm_text = 'Are you sure to send?';
                let confirm_result = confirm(confirm_text);
                if (confirm_result !== true) {
                    alert('Canceled');
                    return;
                }

                let transaction_data = {
                    'sender_private_key': $('#private_key').val(),
                    'sender_blockchain_address': $('#blockchain_address').val(),
                    'recipient_blockchain_address': $('#recipient_blockchain_address').val(),
                    'sender_public_key': $('#public_key').val(),
                    'value': sendAmount,
                };

                $.ajax({
                    url: '/transaction',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(transaction_data),
                    success: function (response) {
                        console.info(response);
                        if (response.message === 'fail') {
                            alert('Send fail');
                        } else {
                            alert('Send success');
                        }
                    },
                    error: function (response) {
                        console.error(response);
                        alert('Send failed');
                    }
                });
            });

            function reload_amount() {
                let data = {'blockchain_address': $('#blockchain_address').val()};
                $.ajax({
                    url: '/wallet/amount',
                    type: 'GET',
                    data: data,
                    success: function (response) {
                        let amount = response['amount'];
                        $('#wallet_amount').text(amount);
                        console.info(amount);
                    },
                    error: function (error) {
                        console.error(error);
                    }
                });
            }

            setInterval(reload_amount, 1000);
        });
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-8 md:p-12">
    <!-- Wallet Section -->
    <div class="mb-12">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Wallet</h1>
        <div class="flex items-center mb-6">
            <span class="text-lg font-medium text-gray-600 mr-2">Balance:</span>
            <span class="text-2xl font-semibold text-blue-600" id="wallet_amount">0</span>
        </div>

        <div class="space-y-6">
            <!-- Public Key -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="public_key">Public Key</label>
                <textarea
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 textarea-resize-none"
                        id="public_key"
                        rows="2"
                ></textarea>
            </div>

            <!-- Private Key -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="private_key">Private Key</label>
                <textarea
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 textarea-resize-none"
                        id="private_key"
                        rows="1"
                ></textarea>
            </div>

            <!-- Blockchain Address -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="blockchain_address">Blockchain
                    Address</label>
                <textarea
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 textarea-resize-none"
                        id="blockchain_address"
                        rows="1"
                ></textarea>
            </div>
        </div>
    </div>

    <!-- Send Money Section -->
    <div>
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Send Money</h2>
        <div class="space-y-6">
            <!-- Recipient Address -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="recipient_blockchain_address">Recipient
                    Address</label>
                <input
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 input-focus"
                        id="recipient_blockchain_address"
                        placeholder="Enter recipient blockchain address"
                        type="text"
                >
            </div>

            <!-- Amount -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="send_amount">Amount</label>
                <input
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 input-focus"
                        id="send_amount"
                        min="0"
                        placeholder="Enter amount to send"
                        step="0.01"
                        type="number"
                >
            </div>

            <!-- Send Button -->
            <div>
                <button
                        class="w-full md:w-auto px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200"
                        id="send_money_button"
                >
                    Send
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
